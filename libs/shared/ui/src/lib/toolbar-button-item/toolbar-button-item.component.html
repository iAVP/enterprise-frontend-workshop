@switch (item().style) {
	@case ('outlined') {
		<button mat-outlined-button type="button" (click)="onClick()">
			<ng-container *ngTemplateOutlet="buttonContent" />
		</button>
	}
	@case ('filled') {
		<button mat-flat-button type="button" (click)="onClick()">
			<ng-container *ngTemplateOutlet="buttonContent" />
		</button>
	}
	@case ('elevated') {
		<button mat-elevated-button type="button" (click)="onClick()">
			<ng-container *ngTemplateOutlet="buttonContent" />
		</button>
	}
	@case ('tonal') {
		<button mat-button class="toolbar-button--tonal" type="button" (click)="onClick()">
			<ng-container *ngTemplateOutlet="buttonContent" />
		</button>
	}
	@default {
		<button mat-button type="button" (click)="onClick()">
			<ng-container *ngTemplateOutlet="buttonContent" />
		</button>
	}
}

<ng-template #buttonContent>
	@if (item().icon) {
		<mat-icon aria-hidden="true">{{ item().icon }}</mat-icon>
	}
	@if (item().text) {
		<span>{{ item().text }}</span>
	}
</ng-template>
