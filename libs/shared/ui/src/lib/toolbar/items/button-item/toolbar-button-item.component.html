@switch (item().style) {
	@case ('outlined') {
		<button mat-stroked-button type="button" [attr.aria-label]="item().text" [attr.title]="item().text" (click)="onClick()">
			<ng-container *ngTemplateOutlet="buttonContent" />
		</button>
	}
	@case ('filled') {
		<button mat-flat-button type="button" [attr.aria-label]="item().text" [attr.title]="item().text" (click)="onClick()">
			<ng-container *ngTemplateOutlet="buttonContent" />
		</button>
	}
	@case ('elevated') {
		<button mat-elevated-button type="button" [attr.aria-label]="item().text" [attr.title]="item().text" (click)="onClick()">
			<ng-container *ngTemplateOutlet="buttonContent" />
		</button>
	}
	@case ('tonal') {
		<button mat-button class="toolbar-button--tonal" type="button" [attr.aria-label]="item().text" [attr.title]="item().text" (click)="onClick()">
			<ng-container *ngTemplateOutlet="buttonContent" />
		</button>
	}
	@default {
		<button mat-button type="button" [attr.aria-label]="item().text" [attr.title]="item().text" (click)="onClick()">
			<ng-container *ngTemplateOutlet="buttonContent" />
		</button>
	}
}

<ng-template #buttonContent>
	@if (item().icon) {
		<i [class]="item().icon" aria-hidden="true"></i>
	}
	@if (item().text) {
		<span>{{ item().text }}</span>
	}
</ng-template>
