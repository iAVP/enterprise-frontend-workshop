<form class="transaction-form" (submit)="onSubmit($event)" novalidate>
  <div class="form-field">
    <label for="description">Description</label>
    <input
      id="description"
      name="description"
      type="text"
      required
      maxlength="120"
      [value]="description"
      (input)="description = $any($event.target).value"
    />
  </div>
  <div class="form-field">
    <label for="amount">Amount ({{ currency }})</label>
    <input
      id="amount"
      name="amount"
      type="number"
      min="0.01"
      step="0.01"
      required
      [value]="amount"
      (input)="amount = $any($event.target).value"
    />
  </div>
  <div class="form-field">
    <label for="date">Date</label>
    <input
      id="date"
      name="date"
      type="date"
      required
      [value]="date"
      (input)="date = $any($event.target).value"
    />
  </div>
  @if (errorMessage) {
    <p class="error" role="alert">{{ errorMessage }}</p>
  }
  <div class="actions">
    <button type="submit">Save</button>
    <button type="button" class="secondary" (click)="onCancel()">Cancel</button>
  </div>
</form>
