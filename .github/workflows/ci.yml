name: CI

on:
    workflow_dispatch:
    push:
        branches:
            - "Angular-in-Depth-Part-2-Evolution-of-Angular-and-Architectural-Thinking+1"
    pull_request:
        branches:
            - "Angular-in-Depth-Part-2-Evolution-of-Angular-and-Architectural-Thinking+1"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    quality:
        name: Lint, unit test, E2E and build
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            CI: true
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: Run ESLint
              run: npm run lint

            - name: Run unit tests
              run: npm test

            - name: Run E2E tests
              run: npm run e2e:chromium

            - name: Build application
              run: npm run build
